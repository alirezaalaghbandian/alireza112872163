replicaCount:
  api: 2
  web: 2
  worker: 1

image:
  registry: ghcr.io
  api:
    repository: opscore/api
    tag: latest
  web:
    repository: opscore/web
    tag: latest
  worker:
    repository: opscore/worker
    tag: latest
  pullPolicy: IfNotPresent

service:
  api:
    type: ClusterIP
    port: 3001
  web:
    type: ClusterIP
    port: 3000

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: opscore.example.com
      paths:
        - path: /
          pathType: Prefix
          service: web
        - path: /api
          pathType: Prefix
          service: api

resources:
  api:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi
  web:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  worker:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi

autoscaling:
  api:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  worker:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80

env:
  NODE_ENV: production
  DATABASE_URL: ""
  REDIS_URL: ""
  JWT_SECRET: ""

podDisruptionBudget:
  api:
    minAvailable: 1
  web:
    minAvailable: 1
