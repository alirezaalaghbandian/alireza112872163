apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-api-netpol
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: opscore-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: opscore-web
      ports:
        - protocol: TCP
          port: 3001
  egress:
    - to: []
